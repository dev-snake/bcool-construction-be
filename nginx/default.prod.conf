server {
    listen 80;
    server_name api.bcool.com.vn;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name api.bcool.com.vn;

    ssl_certificate /etc/letsencrypt/live/api.bcool.com.vn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.bcool.com.vn/privkey.pem;

    location / {
        proxy_pass http://bcool-be:3000; # Đổi từ server sang bcool-be và port 8998 sang 3000
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}