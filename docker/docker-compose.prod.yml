services:
  api:
    image: ghcr.io/dev-snake/bcool-construction-be:latest
    build:
      context: ..
      dockerfile: docker/Dockerfile.prod
    container_name: bcool-api-prod
    ports:
      - "127.0.0.1:8080:3000"
    env_file:
      - ../.env.production
    environment:
      NODE_ENV: production
      DB_HOST: db
      REDIS_HOST: redis
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - backend-net
    restart: always

  db:
    image: postgres:15-alpine
    container_name: bcool-db-prod
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_DATABASE}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend-net
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: bcool-redis-prod
    command: >
      redis-server
      --appendonly yes
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    networks:
      - backend-net
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

networks:
  backend-net:
    driver: bridge

volumes:
  postgres_data:
    name: bcool_postgres_data_prod
  redis_data:
    name: bcool_redis_data_prod
