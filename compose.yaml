services:
  nginx:
    image: nginx:latest
    container_name: bcool_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.prod.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro

  server:
    build:
      context: .
    container_name: bcool-be
    restart: always
    env_file:
      - .env
    environment:
      - DB_HOST=db
      - REDIS_HOST=redis
    ports:
      - "8998:3000"
    depends_on:
      - db
      - redis

  db:
    image: postgres:15-alpine
    container_name: bcool-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-bcool_construction}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-123456789}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  redis:
    image: redis:7
    container_name: bcool-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-supersecret}
    ports:
      - "6379:6379"

volumes:
  postgres_data: