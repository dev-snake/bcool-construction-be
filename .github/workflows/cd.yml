name: CD

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed
    branches:
      - master
      - production

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add server to known hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy to server
        run: |
          ssh ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} << 'ENDSSH'
            # Kiểm tra nếu thư mục chưa tồn tại thì clone source code về
            if [ ! -d "${{ secrets.DEPLOY_PATH }}" ]; then
              echo "Thư mục deploy chưa tồn tại. Tiến hành clone dư án..."
              git clone https://github.com/${{ github.repository }}.git ${{ secrets.DEPLOY_PATH }}
            fi

            cd ${{ secrets.DEPLOY_PATH }}

            # Cập nhật code cấu hình compose.yaml mới nhất
            git fetch origin
            git reset --hard origin/master
            
            # Tải image mới từ GHCR (Lệnh docker compose mới thay docker-compose)
            docker compose pull

            # Khởi động lại container bằng image mới (Xóa rác dư thừa)
            docker compose down --remove-orphans
            docker compose up -d

            # Kiểm tra trạng thái
            docker ps
          ENDSSH

      - name: Notify deployment status
        if: always()
        run: |
          if [ "${{ job.status }}" == "success" ]; then
            echo "✅ Deployment successful!"
          else
            echo "❌ Deployment failed!"
          fi
